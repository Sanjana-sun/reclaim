name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: overturn_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Eval harness (drafter + bill detector guardrails)
        run: npm run eval
      - name: Boot + migrate against Postgres, hit health
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/overturn_ci
        run: |
          node server/index.js & SERVER=$!
          sleep 3
          curl -sf http://localhost:3000/api/health | grep '"backend":"pg"'
          kill $SERVER
